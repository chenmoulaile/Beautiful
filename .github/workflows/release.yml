name: release

# 推送 v* 标签时自动构建、打包并创建 GitHub Release。
# Release 资产由本工作流独占（唯一归属方）；scripts/release.ps1 只负责本地测试门禁、
# 版本号、打 tag 与推送，不再自行上传资产，避免同名资产竞争。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译 native（v4 Phase 2，/W4 /WX）
        shell: pwsh
        run: |
          $out = cmd /c "scripts\build-native.cmd Release" 2>&1 | Tee-Object -FilePath native-build.log
          $out | ForEach-Object { Write-Host $_ }
          exit $LASTEXITCODE

      # native 代码从未在本机编译过（所有者机器无 MSVC）：失败时把完整输出存成产物，
      # 仓库所有者在 Actions 页即可下载定位，不用翻网页控制台。
      - name: 上传 native 构建日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: native-build.log
          if-no-files-found: ignore

      - name: NativeSmoke（无桌面部分进 CI）
        shell: cmd
        run: tools\NativeSmoke\bin\Release\NativeSmoke.exe src\Beautiful.Native\bin\Release\Beautiful.Native.dll

      - name: 还原与构建
        shell: pwsh
        run: |
          $out = dotnet build Beautiful.sln -c Release 2>&1 | Tee-Object -FilePath build.log
          $out | ForEach-Object { Write-Host $_ }
          exit $LASTEXITCODE

      - name: 测试门禁
        shell: pwsh
        run: |
          $out = dotnet test tests/Beautiful.Core.Tests -c Release 2>&1 | Tee-Object -FilePath test.log
          $out | ForEach-Object { Write-Host $_ }
          exit $LASTEXITCODE

      - name: 发布自包含产物
        shell: pwsh
        run: |
          $out = dotnet publish src/Beautiful.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:UseAppHost=true -o publish 2>&1 | Tee-Object -FilePath publish.log
          $out | ForEach-Object { Write-Host $_ }
          exit $LASTEXITCODE

      # 诊断日志在失败时下载可得（Actions 网页日志需要 admin 权限，产物走 API 即可拉取）
      - name: 上传诊断日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-logs
          path: |
            build.log
            test.log
            publish.log
            native-build.log
          if-no-files-found: ignore

      - name: 压缩
        run: Compress-Archive -Path publish/* -DestinationPath Beautiful-win-x64-${{ github.ref_name }}.zip
        shell: pwsh

      # 安装程序：与 zip 是同一件产物（同一个 publish 目录），只是多了卸载器、开始菜单与"装前请退出旧实例"。
      # 版本号要剥掉 tag 的前导 v：Inno 的 VersionInfoVersion 只收纯数字。
      - name: 打安装程序（Inno Setup）
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if (-not (Test-Path $iscc)) { throw "Inno Setup 不可用：镜像里没有，choco 也没装上" }
          }
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\publish" "/DOutputDir=$PWD\installer-out" installer\Beautiful.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败（退出码 $LASTEXITCODE）" }

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Beautiful-win-x64-${{ github.ref_name }}.zip
            installer-out/Beautiful-Setup-*.exe
          body: |
            Beautiful ${{ github.ref_name }} — Windows 11 桌面美化套件：macOS/Linux/鸿蒙三主题悬浮 Dock + macOS 顶栏 + SMTC 媒体控制与双语歌词 + Alt+Tab 替换切换器 + macOS 式 genie 最小化动画。

            **两种拿法，内容是同一件产物：**
            - `Beautiful-Setup-v*.exe` — 安装程序（按用户安装、免管理员；开始菜单快捷方式 + 控制面板可卸载）
            - `Beautiful-win-x64-v*.zip` — 免安装压缩包，解压后直接运行 `Beautiful.exe`

            两者都是自包含的，不需要另装 .NET 运行时。
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
