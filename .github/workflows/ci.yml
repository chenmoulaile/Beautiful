name: ci

# 每次推送都要过的门禁（release.yml 只在打 v* 标签时才跑，日常验证靠本文件）。
# windows-latest 是唯一权威门禁：native /W4 /WX、sln 0 警告、1390 测试全绿——
# 与 README「构建与门禁」一节的口径一致，agent 在非 Windows 机器上开发时以此为准。
# ubuntu 岗只做交叉编译哨兵（-p:EnableWindowsTargeting=true）：验证 WPF 在无桌面环境下
# 仍可编译（agent 本机验证路径与 CI 同构），不跑测试——Linux runner 的区域设置会让
# 时钟/盘符类用例出现与产品无关的红。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  windows-gate:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译 native（/W4 /WX，与 release.yml 同口径）
        shell: cmd
        run: scripts\build-native.cmd Release

      - name: NativeSmoke（无桌面部分进 CI）
        shell: cmd
        run: tools\NativeSmoke\bin\Release\NativeSmoke.exe src\Beautiful.Native\bin\Release\Beautiful.Native.dll

      # alpha.16：CBT 前置钩子层（Linux MinGW 交叉编译产物随仓交付）——
      # 校验它是 x64 DLL 且四个导出在位（LoadLibrary + GetProcAddress 探针）
      - name: HookDll 探针（x64 PE + 四导出）
        shell: pwsh
        run: |
          $dll = "native/hook/Beautiful.Hook.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "MZ missing" }
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class HookProbe {
              [DllImport("kernel32", SetLastError=true)] public static extern IntPtr LoadLibrary(string p);
              [DllImport("kernel32", SetLastError=true)] public static extern IntPtr GetProcAddress(IntPtr m, string n);
          }
          '@
          $m = [HookProbe]::LoadLibrary((Resolve-Path $dll))
          if ($m -eq [IntPtr]::Zero) { throw "LoadLibrary failed: $([System.Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          foreach ($e in "BH_Install","BH_Uninstall","BH_Suppress","BH_Version") {
              if ([HookProbe]::GetProcAddress($m, $e) -eq [IntPtr]::Zero) { throw "export missing: $e" }
          }
          Write-Host "HookDll OK：x64 PE + 4 导出在位"

      - name: 构建（0 警告 0 错误）
        run: dotnet build Beautiful.sln -c Release

      - name: 测试门禁
        run: dotnet test tests/Beautiful.Core.Tests -c Release

  linux-cross-build:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 交叉编译 WPF 解决方案（EnableWindowsTargeting 哨兵）
        run: dotnet build Beautiful.sln -c Release -p:EnableWindowsTargeting=true
